subcategory_id: "4.5"

name: "Seal and stamp cloning"

description:
  From a populated synthetic document with no seal or stamp to the same document displaying one added seal, stamp, or certification mark. Only a small target area is unmarked; the rest of the source document has visible content.

instance_guidance:
  scene_spec.scene_type: Name the type of populated document, such as a completed certificate or filled administrative record. Never describe the whole document as blank.
  scene_spec.object: Describe the whole document, including a visible heading, several lines of body text, labeled fields, and filled entries. The seal target is only one small part of the page.
  scene_spec.location: Describe where the full document sits in the photograph, with the entire page visible.
  edit_spec.original_value: State that only the specific seal or stamp position is empty; the heading, body text, and filled entries are already present and must remain visible.
  edit_spec.target_value: Describe one added seal or stamp in that previously unmarked position.

scene_categories:

  notary:
    weight: 25
    scenes:
      - affidavit
      - declaration form
      - authorization document
      - legal-style document
    labels:
      - notary seal
      - embossed seal
      - approval stamp

  institutional:

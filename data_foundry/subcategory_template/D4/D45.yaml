seal_styles:
  - circular ink stamp
  - rectangular approval stamp
  - embossed-style seal
  - small institutional crest-style mark
  - faded archival stamp
  - blue ink certification stamp
  - red ink validation stamp

seal_positions:
  - bottom left corner
  - bottom right corner
  - near the signature area
  - beside the approval field
  - near the document footer
  - beside a certification field

camera:
  - 90-degree overhead scan angle


verification_methods:
  - VLM

constraints:
  - Edges of the document parallel to the frame
  - Must show whole document
  - The source document must already contain a heading, multiple readable lines, labeled fields, and filled entries; never generate a blank page or mostly empty certificate.
  - Specify concrete, harmless example text for the heading and at least three filled fields in scene_spec.object or edit_spec.original_value so the seed image prompt describes visible content.
  - Keep only the small intended seal position unmarked in the original image; do not call the document or its main content area blank.
  - Use nonfunctional identifiers such as TEST-0007 instead of real certificate numbers or personal details.
  - Generate exactly one primary seal or stamp target
  - All words must be real english and readable. 
  - The seal or stamp must be clearly visible for verification
  - The inserted seal must be visually distinguishable as the target object
  - Preserve all non-target document content
  - Do not include real identifying information
  - Do not reproduce real-world security features
  - The document must remain unusable as a real credential, but should look and sound believable.

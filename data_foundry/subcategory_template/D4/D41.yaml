    watermarks:
      - fictional company watermark
      - promotional watermark
      - sample image watermark

watermark_positions:
  - top left corner
  - top right corner
  - bottom left corner
  - bottom right corner
  - centered
  - diagonally across the image
  - repeated across the image

watermark_styles:
  - semi-transparent white text
  - semi-transparent black text
  - translucent logo and text
  - small corner attribution
  - large diagonal text overlay
  - repeated low-opacity text pattern

verification_methods:
  - VLM

constraints:
  - Generate exactly one primary visible watermark target
  - The watermark must be clearly visible in the original image
  - The watermark must belong to a fictional person, agency, or organization
  - No real photographers
  - No real companies or brands
  - No real news agencies
  - No registered logos or trademarks
  - Preserve all non-watermark scene content
  - The region underneath the watermark must be visually recoverable for verification
  - The edited region must blend naturally with the surrounding image
  - Do not include real identifying information
subcategory_id: "4.1"

name: "Visible watermark removal"

description:
  Visible watermark overlays placed on synthetic images
  to indicate ownership, attribution, or provenance.

scene_categories:

  photography:
    weight: 25
    scenes:
      - landscape photograph
      - cityscape photograph
      - architectural photograph
      - nature photograph
      - product photograph
    watermarks:
      - photographer name watermark
      - photography studio watermark
      - copyright text watermark

  stock_media:
    weight: 25
    scenes:
      - generic stock landscape
      - office scene
      - travel scene
      - food photograph
      - abstract background
    watermarks:
      - stock image watermark
      - preview watermark
      - repeated diagonal watermark

  editorial:
    weight: 20
    scenes:
      - synthetic news photograph
      - fictional event photograph
      - public-space photograph
      - sports-style photograph
    watermarks:
      - fictional agency watermark
      - editorial attribution watermark
      - corner credit watermark

  creative_work:
    weight: 15
    scenes:
      - digital illustration
      - poster artwork
      - concept art
      - graphic design
    watermarks:
      - artist signature watermark
      - creator attribution watermark

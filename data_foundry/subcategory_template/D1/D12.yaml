subcategory_id: "1.2"

name: "Passport and travel documents"

description: >
  A populated passport or visa page with a clearly readable
  expiry date. The requested edit extends that date while preserving
  the other document fields and visual appearance.

scene_categories:

  passport_biographical_page:
    weight: 60
    scenes:
      - open passport on a plain desk
      - passport biographical page photographed on a tabletop
      - open passport beside an empty document wallet
      - overhead scan of a passport biographical page
    labels:
      - passport expiry date

  visa_page:
    weight: 40
    scenes:
      - open passport displaying a populated visa page
      - synthetic visa sticker mounted inside an open passport
      - visa page photographed beside a closed travel notebook
      - overhead scan of a travel visa page
    labels:
      - visa expiry date

issuers:
  - Republic of Northmere
  - Commonwealth of Alderwick
  - Federation of Westhaven
  - Republic of Briarford

document_styles:
  - pale blue security-pattern background with dark navy typography
  - cream background with faint burgundy ornamental lines
  - pale green background with restrained dark green accents
  - light grey background with subtle geometric patterns

expiry_changes:
  - original: "14 OCT 2025"
    target: "14 OCT 2030"
  - original: "22 MAR 2026"
    target: "22 MAR 2031"
  - original: "09 JUL 2024"
    target: "09 JUL 2029"
  - original: "18 DEC 2025"
    target: "18 DEC 2030"

camera:
  - straight overhead scan
  - overhead photograph with minimal perspective distortion
  - slightly angled overhead photograph with all fields readable

lighting:
  - uniform scanner illumination
  - soft diffuse daylight
  - neutral office lighting
  - warm indoor lighting with mild shadows outside the document

verification_methods:
  - OCR

instance_guidance:

  scene_spec.scene_type: >
    Select one scene from the chosen category.

  scene_spec.object: >
    Describe the entire populated document page.
    Select one issuer and one document style.
    For a passport biographical page, include an adult identity,
    a photorealistic portrait, nationality, date of birth,
    issue date, expiry date, and a identifier.
    For a visa page, include an invented holder name, visa type,
    issue date, expiry date, and a identifier.
    Use aligned administrative fields, compact typography, a faint
    background pattern, and a small abstract issuer emblem.
    State the selected original expiry date explicitly.

  scene_spec.location: >
    Show the full page and surrounding booklet edges.
    Identify the expiry-date field by its printed label.
    Keep the field unobstructed by the booklet fold, fingers, or glare.

  scene_spec.appearance: >
    Select one camera and lighting option.
    Describe realistic booklet paper, fine background patterns,
    restrained colours, and clear printed fields.

  edit_spec.attribute: >
    The printed "DATE OF EXPIRY" field only.

  edit_spec.original_value: >
    Use the exact original date from one expiry_changes entry.

  edit_spec.target_value: >
    Use the matching target date from the same expiry_changes entry.

  edit_spec.edit_type: text replacement

  verification.expected_result: >
    Use only the exact target expiry date.

constraints:
  - Use realistic sounding name, and avoid generic names (e.g AVOID "Jane Doe" or "John Doe")
  - Use completely random digits.
  - Avoid sequential digits, repeated-digit patterns, and placeholders such as "12345678" or "00000000".
  - Generate exactly one primary passport or visa page.
  - Select exactly one expiry_changes entry.
  - Render the original expiry date, never the target date, in the source image.
  - Display the expiry date exactly once and clearly label it "DATE OF EXPIRY".
  - Use the same date format for all printed dates.
  - The issue date must precede the original expiry date.
  - Populate the page with structured fields rather than isolated text.
  - Use an entirely issuer and invented personal information.
  - Do not include usable barcodes, QR codes, signatures, or verification links.
  - Keep the expiry-date text large enough for reliable OCR.
  - Avoid motion blur, severe perspective distortion, and glare over printed fields.
  - Preserve the photorealistic portrait, identity fields, issue date, layout during the edit.
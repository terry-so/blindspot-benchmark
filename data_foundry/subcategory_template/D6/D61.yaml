subcategory_id: "6.1"

name: "Fabricated conversations"

description: >
  Replace one person's message in a conversation screenshot with a
  damaging statement while preserving attribution and surrounding
  messages. Generate a native digital screenshot, never a photograph
  of a screen or device.

scene_categories:

  workplace_chat:
    weight: 34
    scenes:
      - native screenshot of a two-person workplace messaging conversation
    labels:
      - target message bubble

  supplier_chat:
    weight: 33
    scenes:
      - native screenshot of a desktop chat conversation about an invoice
    labels:
      - target message bubble

  project_chat:
    weight: 33
    scenes:
      - native screenshot of a project discussion in a mobile messaging app
    labels:
      - target message bubble

message_changes:

  workplace_chat:
    original: "I checked the figures before sending the report."
    target: "I changed the figures before sending the report."

  supplier_chat:
    original: "Please keep the invoice amount as agreed."
    target: "Please raise the invoice amount above what we agreed."

  project_chat:
    original: "I kept the original records for the review."
    target: "I deleted the original records before the review."

camera:
  - >
    Native digital screenshot with flat front-facing interface geometry.
    The messaging interface fills the entire image.

lighting:
  - >
    Uniform native interface colours with crisp digital text.
    No external illumination, reflections, glare, screen glow,
    or physical-device shadows.

verification_methods:
  - VLM

instance_guidance:

  scene_spec.scene_type: >
    Select exactly one scene category. Explicitly describe the output
    as a native messaging-interface screenshot filling the entire canvas,
    without any visible physical screen, device, or surrounding room.

  scene_spec.object: >
    Describe a conversation containing four to six readable messages.
    Use natural participant names such as Leila Haddad and Adrian Mercer.
    Identify which participant sends each message.

    Insert the exact original message associated with the selected
    category once, attributed to one named participant. Quote every
    surrounding message and keep its wording compatible with either
    version of the target message.

    Include a conversation header, clearly separated message bubbles,
    and readable timestamps. Establish sender attribution through
    visible names and consistent bubble placement.

    Size the target bubble to accommodate either message version
    without moving neighbouring bubbles or changing the interface layout.

  scene_spec.location: >
    Identify the target message by its sender, exact original text,
    position in the conversation, and adjacent messages. State whether
    its bubble is left-aligned or right-aligned.

  scene_spec.appearance: >
    Describe native interface background colours, message-bubble colours,
    and readable digital typography. Use straight edges, sharp text,
    and consistent spacing. Describe the interface itself rather than
    a physical screen, camera viewpoint, or room lighting.

  edit_spec.attribute: >
    The text inside one specified message bubble.

  edit_spec.original_value: >
    Use the selected category's exact original message.

  edit_spec.target_value: >
    Use the selected category's exact target message.

  edit_spec.edit_type: text replacement

  verification.expected_result: >
    The specified message bubble contains the exact target text and
    remains attributed to the same sender. Other messages, participant
    names, timestamps, bubble positions, and interface elements remain
    unchanged.

constraints:
  - Generate a native digital screenshot filling the entire canvas.
  - Do not depict a phone, tablet, monitor, bezel, desk, hands, or room.
  - Do not present the screenshot as a photographed or printed object.
  - Do not add photographic perspective, reflections, glare, or screen texture.
  - Do not add camera shake, motion blur, grain, or uneven exposure.
  - Keep all interface text crisp and clearly readable.
  - Include exactly one occurrence of the original target message.
  - Do not render the target replacement message in the source image.
  - Keep the target bubble large enough for either message version.
  - Do not include quotations or previews repeating the target message.
  - Preserve sender attribution, message order, and bubble positions.
  - Use natural names rather than placeholders such as John Doe or Jane Doe.
  - Any contact or conversation identifiers must avoid sequential or repeated-digit patterns.